# ---------------------------------------------------------------------------
# Stack *arr - prowlarr / sonarr / radarr / bazarr / flaresolverr
# Todos na rede externa ${MEDIA_NETWORK}, publicados em portas 7xxx.
#
#   docker network create medianet
#   docker compose up -d
# ---------------------------------------------------------------------------
name: arr

x-common: &common
  restart: unless-stopped
  environment: &common-env
    PUID: ${PUID}
    PGID: ${PGID}
    UMASK: ${UMASK}
    TZ: ${TZ}
  networks:
    - medianet

# /data e a raiz unica: use /data/downloads e /data/content dentro dos apps
# para que hardlink + atomic move funcionem (mesmo mountpoint).
x-vol-data: &vol-data ${MEDIA_ROOT}:/data
# Atalhos pedidos: os mesmos diretorios, montados direto.
x-vol-downloads: &vol-downloads ${DOWNLOADS_DIR}:/downloads
x-vol-content: &vol-content ${CONTENT_DIR}:/content

services:
  # --- Indexadores --------------------------------------------------------
  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    hostname: prowlarr
    environment:
      <<: *common-env
      # Config via env (Servarr aceita PREFIXO__SECAO__CHAVE)
      PROWLARR__AUTH__APIKEY: ${PROWLARR_API_KEY}
      PROWLARR__AUTH__METHOD: Forms
      PROWLARR__AUTH__REQUIRED: DisabledForLocalAddresses
      PROWLARR__SERVER__PORT: 9696
      PROWLARR__APP__INSTANCENAME: Prowlarr
      PROWLARR__LOG__LEVEL: info
      # Alvos de sincronizacao (usados pelo bootstrap.sh)
      SONARR_URL: ${SONARR_INTERNAL_URL}
      SONARR_API_KEY: ${SONARR_API_KEY}
      RADARR_URL: ${RADARR_INTERNAL_URL}
      RADARR_API_KEY: ${RADARR_API_KEY}
      FLARESOLVERR_URL: ${FLARESOLVERR_INTERNAL_URL}
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    ports:
      - ${PROWLARR_PORT}:9696
    depends_on:
      - flaresolverr

  flaresolverr:
    <<: *common
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    hostname: flaresolverr
    environment:
      <<: *common-env
      LOG_LEVEL: info
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
      PORT: 8191
      HOST: 0.0.0.0
      TEST_URL: https://www.google.com
    ports:
      - ${FLARESOLVERR_PORT}:8191

  # --- Series -------------------------------------------------------------
  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    hostname: sonarr
    environment:
      <<: *common-env
      SONARR__AUTH__APIKEY: ${SONARR_API_KEY}
      SONARR__AUTH__METHOD: Forms
      SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
      SONARR__SERVER__PORT: 8989
      SONARR__APP__INSTANCENAME: Sonarr
      SONARR__LOG__LEVEL: info
      # Integracoes (lidas pelo bootstrap.sh)
      PROWLARR_URL: ${PROWLARR_INTERNAL_URL}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY}
      DOWNLOAD_CLIENT_URL: ${TRANSMISSION_INTERNAL_URL}
      DOWNLOAD_CLIENT_USER: ${TRANSMISSION_USER}
      DOWNLOAD_CLIENT_PASS: ${TRANSMISSION_PASS}
      ROOT_FOLDER: /data/content/tv
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - *vol-data
      - *vol-downloads
      - *vol-content
    ports:
      - ${SONARR_PORT}:8989

  # --- Filmes -------------------------------------------------------------
  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    hostname: radarr
    environment:
      <<: *common-env
      RADARR__AUTH__APIKEY: ${RADARR_API_KEY}
      RADARR__AUTH__METHOD: Forms
      RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
      RADARR__SERVER__PORT: 7878
      RADARR__APP__INSTANCENAME: Radarr
      RADARR__LOG__LEVEL: info
      PROWLARR_URL: ${PROWLARR_INTERNAL_URL}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY}
      DOWNLOAD_CLIENT_URL: ${TRANSMISSION_INTERNAL_URL}
      DOWNLOAD_CLIENT_USER: ${TRANSMISSION_USER}
      DOWNLOAD_CLIENT_PASS: ${TRANSMISSION_PASS}
      ROOT_FOLDER: /data/content/movies
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - *vol-data
      - *vol-downloads
      - *vol-content
    ports:
      - ${RADARR_PORT}:7878

  # --- Legendas -----------------------------------------------------------
  bazarr:
    <<: *common
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    hostname: bazarr
    environment:
      <<: *common-env
      # Bazarr nao le config por env; o bootstrap.sh escreve o config.ini
      # com estes valores antes do primeiro start.
      SONARR_URL: ${SONARR_INTERNAL_URL}
      SONARR_API_KEY: ${SONARR_API_KEY}
      RADARR_URL: ${RADARR_INTERNAL_URL}
      RADARR_API_KEY: ${RADARR_API_KEY}
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - *vol-data
      - *vol-downloads
      - *vol-content
    ports:
      - ${BAZARR_PORT}:6767
    depends_on:
      - sonarr
      - radarr

networks:
  medianet:
    name: ${MEDIA_NETWORK}
    external: true
