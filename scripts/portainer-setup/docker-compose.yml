services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:sts
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer_data:/data
    ports:
      - 9443:9443
      - 9000:9000
      - 8000:8000  # remove if you won't use to control other portainer agents

networks:
  default:
    name: portainer_network